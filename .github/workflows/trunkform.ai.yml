name: trunkform-ai

concurrency: trunkform-ai

on:
  push:
    branches:
      - trunk
    paths:
      - 'trunkform.ai/**/*'
      - '.github/workflows/trunkform.ai.yml'

jobs:
  ci-then-cd:
    name: ${{ matrix.ENV }}
    defaults:
      run:
        working-directory: ./trunkform.ai
    strategy:
      matrix:
        ENV:
          - ci
          - prod
      max-parallel: 1
    permissions:
      contents: read  # This is required for actions/checkout

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
