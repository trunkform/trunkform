name: trunkform-ai

concurrency: trunkform-ai

on:
  push:
    branches:
      - trunk
    paths:
      - 'trunkform.ai/**/*'
      - '.github/workflows/trunkform.ai.yml'
      - 'remote_state.hcl'

env:
  tf_version: '1.14.4'
  TG_NON_INTERACTIVE: true

jobs:
  ci-then-cd:
    name: ${{ matrix.ENV.environment }}
    defaults:
      run:
        working-directory: ./trunkform.ai
    strategy:
      matrix:
        ENV:
          - environment: ci
            account: 810322435582
          - environment: cd
            account: 245760921574
      max-parallel: 1
    permissions:
      id-token: write # This is required for OIDC authentication with AWS
      contents: read  # This is required for actions/checkout

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::${{ matrix.ENV.account }}:role/github-oidc-provider-trunkform
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.tf_version }}
      - run: |
          curl -L https://github.com/gruntwork-io/terragrunt/releases/download/v0.99.1/terragrunt_linux_amd64.tar.gz -o terragrunt_linux_amd64.tar.gz
          echo "0e6e195111d614d9df0285d1593c5d26d801e205e805b7e0acaaf36fea28911d  terragrunt_linux_amd64.tar.gz" | shasum -a 256 -c
          tar xz < terragrunt_linux_amd64.tar.gz && chmod u+x terragrunt_linux_amd64 && sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      - run: terragrunt run --all init --working-dir ./infra/${{ matrix.ENV.environment }}
      - run: terragrunt run --all apply --working-dir ./infra/${{ matrix.ENV.environment }}
      - run: aws s3 sync ./dist s3://trunkform-ai-${{ matrix.ENV.account }} --delete
      - run: |
          DIST_ID=$(terragrunt output -raw distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
        working-directory: ./trunkform.ai/infra/${{ matrix.ENV.environment }}/www
      - if: ${{ matrix.ENV.environment == 'ci' }}
        name: simple int test
        run: curl -sf https://trunkform.io
      - if: ${{ matrix.ENV.environment == 'ci' }}
        run: terragrunt run --all apply --working-dir ./infra/${{ matrix.ENV.environment }}/www -- -destroy
      - if: always()
        run: rm -rf "**/.terragrunt-cache"
