name: copilot

concurrency: copilot

on:
  push:
    branches:
      - trunk
    paths:
      - 'mcp/**/*'
      - '.github/workflows/copilot.yml'

jobs:
  ci-then-cd:
    name: copilot
    permissions:
      contents: read  # This is required for actions/checkout

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.21'
      - run: make start
        working-directory: ./mcp
      - run: |
          mkdir -p "${{ env.HOME }}/.copilot" && \
          echo '{"mcpServers":{"trunkform":{"type":"http","url":"http://localhost:8080/mcp"}}}' \
            > "${{ env.HOME }}/.copilot/mcp-config.json"
      - uses: actions/setup-copilot@v0
      - run: mkdir -p ./copilot-test
      - run: |
          copilot --allow-all-tools --add-dir ./ --add-dir ../.github -p 'trunkform' > copilot.log 2>&1 && \
          copilot --allow-all-tools --add-dir ./ --add-dir ../.github  --continue  -p 'All remaining rubric items are "N/A"' >> copilot.log 2>&1 && \
          grep -i '🚀' copilot.log
        working-directory: ./copilot-test
      - run: cat copilot.log
        if: always()
      - run: pkill trunkform-mcp || true
        if: always()
