name: copilot

concurrency: copilot

on:
  push:
    branches:
      - trunk
    paths:
      - 'mcp/**/*'
      - '.github/workflows/copilot.yml'

env:
  COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

jobs:
  ci-then-cd:
    name: copilot
    permissions:
      contents: read  # This is required for actions/checkout

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.24'
      - run: make start
        working-directory: ./mcp
      - run: |
          mkdir -p "$HOME/.copilot" && \
          echo '{"mcpServers":{"trunkform":{"type":"http","url":"http://localhost:8080/mcp"}}}' \
            > "$HOME/.copilot/mcp-config.json"
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
      - run: npm install -g @github/copilot
      - run: mkdir -p ./copilot-test
      - run: |
          echo "asserts copilot can get trunkform to yolo state" && \
          copilot \
            --allow-all-tools \
            --add-dir ./ \
            --add-dir ../.github \
            -p 'trunkform. All remaining rubric items are "N/A". Keep calling the trunkform mcp tool until it says we can yolo.' \
              >> copilot.log 2>&1 && \
          grep -i '🚀' copilot.log
        working-directory: ./copilot-test
      - run: cat copilot.log
        working-directory: ./copilot-test
        if: always()
      - run: pkill trunkform-mcp || true
        if: always()
